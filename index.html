<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Введите рост и узнайте длину базовой скакалки: рост + 90 см.">
<meta property="og:type" content="website">
<meta property="og:title" content="Длина скакалки по росту">
<meta property="og:description" content="Введите рост или подвиньте ползунок и узнайте длину базовой скакалки.">
<meta property="og:url" content="https://iurida.github.io/rope-length/">
<meta property="og:image" content="https://iurida.github.io/rope-length/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪢</text></svg>">
<title>Длина скакалки по росту</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Literata:opsz,wght@7..72,600;7..72,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EAED; --surface:#F6F7F8; --ink:#1E2125; --muted:#5A6068; --line:#CBD0D6;
  --paper:#FFFFFF; --paper-ink:#2B2E33; --paper-muted:#7A8088;
  --bead-y:#F2BE22; --bead-o:#EF7D1A; --bead-r:#D6302A; --bead-k:#1D1F22;
  --accent:#C8261F; --accent-soft:rgba(214,48,42,.12);
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1D20; --surface:#25282C; --ink:#ECEDEF; --muted:#A4AAB1; --line:#3A3F45;
    --paper:#F2F2F0; --accent:#FF6A5C; --accent-soft:rgba(255,106,92,.14);
  }
}
:root[data-theme="dark"]{
  --bg:#1B1D20; --surface:#25282C; --ink:#ECEDEF; --muted:#A4AAB1; --line:#3A3F45;
  --paper:#F2F2F0; --accent:#FF6A5C; --accent-soft:rgba(255,106,92,.14);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1100px; margin:0 auto; padding:28px 20px 40px}
header{max-width:62ch; margin-bottom:22px}
h1{
  font-family:var(--serif); font-weight:700; font-size:clamp(30px,5.2vw,52px);
  line-height:1.05; letter-spacing:-.01em; margin:0 0 10px;
}
.lead{margin:0; color:var(--muted); font-size:17px}

.grid{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:22px; align-items:start}
@media (max-width:820px){ .grid{grid-template-columns:1fr} }

/* stage: always a sheet of paper, like the original drawing */
.stage{
  background:var(--paper); border-radius:18px; padding:10px 10px 4px;
  box-shadow:0 1px 0 rgba(0,0,0,.04), 0 14px 40px -24px rgba(20,24,30,.45);
  position:relative; overflow:hidden;
}
@media (min-width:821px){ .stage{position:sticky; top:calc(16px + env(safe-area-inset-top,0px))} }
.stage svg{display:block; width:100%; height:auto}
.fig{mix-blend-mode:multiply}
.svg-serif{font-family:var(--serif)}
.svg-sans{font-family:var(--sans)}

.panel{display:flex; flex-direction:column; gap:18px}
.block{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 18px 16px}

/* height control */
.ctl-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.ctl-head label{font-weight:600; font-size:17px}
.stepper{display:flex; align-items:center; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--bg)}
.stepper button{
  appearance:none; border:0; background:transparent; color:var(--ink);
  width:44px; height:48px; font-size:22px; line-height:1; cursor:pointer; font-family:var(--sans);
}
.stepper button:hover{background:var(--accent-soft)}
.stepper .num{display:flex; align-items:baseline; gap:4px; padding:0 4px}
.stepper input{
  width:3.4ch; border:0; background:transparent; color:var(--ink); text-align:right;
  font-family:var(--serif); font-weight:700; font-size:26px; padding:0;
  -moz-appearance:textfield;
}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
.stepper .unit{color:var(--muted); font-size:15px}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:6px}
.stepper input:focus-visible{outline-offset:0}

.range{margin-top:16px}
input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:28px; background:transparent; margin:0; cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{
  height:6px; border-radius:6px;
  background:linear-gradient(to right, var(--ink) 0 var(--p,50%), var(--line) var(--p,50%) 100%);
}
input[type=range]::-moz-range-track{height:6px; border-radius:6px; background:var(--line)}
input[type=range]::-moz-range-progress{height:6px; border-radius:6px; background:var(--ink)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:26px; height:26px; border-radius:50%; margin-top:-10px;
  background:var(--bead-o); border:4px solid var(--surface); box-shadow:0 0 0 1.5px var(--ink);
}
input[type=range]::-moz-range-thumb{
  width:20px; height:20px; border-radius:50%;
  background:var(--bead-o); border:4px solid var(--surface); box-shadow:0 0 0 1.5px var(--ink);
}
.range-scale{display:flex; justify-content:space-between; color:var(--muted); font-size:13px; margin-top:2px}
.err{color:var(--accent); font-size:14px; margin:10px 0 0; min-height:0}
.err:empty{display:none}

/* result */
.result-title{font-weight:600; font-size:17px; margin:0}
.big{
  font-family:var(--serif); font-weight:700; line-height:.95; margin:6px 0 4px;
  font-size:clamp(64px,10vw,96px); letter-spacing:-.02em; font-variant-numeric:tabular-nums;
}
.big small{font-size:.32em; font-weight:600; letter-spacing:0; margin-left:6px; color:var(--muted)}
.formula{margin:0; color:var(--muted); font-variant-numeric:tabular-nums}
.formula b{color:var(--ink); font-weight:600}
.formula .plus{color:var(--accent); font-weight:600}
.unrolled{margin-top:16px; background:var(--paper); color:var(--paper-ink); border-radius:10px; padding:14px 12px 10px; --accent:#C8261F}
.unrolled svg{display:block; width:100%; height:auto; overflow:visible}
@media (max-width:520px){ #brHt,#brAt{font-size:14px} #barScale text{font-size:11px} }
.unrolled-cap{font-size:13px; color:var(--paper-muted); margin:8px 0 0}

/* note */
.note{
  position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:14px; padding:20px 20px 18px 20px;
}
.note-beads{display:flex; gap:3px; margin-bottom:12px}
.note-beads i{display:block; width:12px; height:6px; border-radius:3px}
.note h2{font-family:var(--serif); font-weight:700; font-size:23px; line-height:1.2; margin:0 0 8px}
.note p{margin:0 0 10px; max-width:60ch; line-height:1.6}
.note .how{color:var(--muted)}
.note .coda{font-family:var(--serif); font-style:italic; font-size:18px; margin:14px 0 0; color:var(--ink)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Длина скакалки по росту</h1>
    <p class="lead">Введите рост или подвиньте ползунок, и рисунок покажет длину базовой скакалки.</p>
  </header>

  <div class="grid">
    <!-- STAGE -->
    <div class="stage" aria-hidden="true">
      <svg viewBox="0 0 236 258" id="stage">
        <!-- ruler -->
        <g id="ruler"></g>
        <rect id="rulerFill" x="30.4" y="0" width="3.2" height="0" rx="1" fill="#D6302A"/>
        <!-- floor -->
        <ellipse cx="106" cy="246" rx="44" ry="3.2" fill="#000" opacity=".06" id="shadow"/>
        <line x1="8" y1="246" x2="230" y2="246" stroke="#2B2E33" stroke-width=".8"/>
        <!-- figure -->
        <image id="fig" class="fig" href="figure.jpg" preserveAspectRatio="none" x="0" y="0" width="10" height="10"/>
        <!-- head line + height label -->
        <line id="headLine" x1="34" x2="100" y1="0" y2="0" stroke="#D6302A" stroke-width=".7" stroke-dasharray="2.2 2"/>
        <g id="hLabel">
          <rect x="-27" y="-9" width="54" height="16" rx="8" fill="#1F2226"/>
          <text id="hText" class="svg-serif" x="0" y="2.9" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">175 см</text>
        </g>
        <!-- rope callout -->
        <g id="ropeCall">
          <circle id="ropeDot" r="2.1" fill="#fff" stroke="#1F2226" stroke-width="1"/>
          <polyline id="ropeLead" fill="none" stroke="#1F2226" stroke-width=".7"/>
          <text id="ropeCap" class="svg-sans" font-size="7.6" fill="#5A6068">скакалка</text>
          <text id="ropeText" class="svg-serif" font-size="12" font-weight="700" fill="#1F2226">265 см</text>
        </g>
      </svg>
    </div>

    <!-- PANEL -->
    <div class="panel">
      <div class="block">
        <div class="ctl-head">
          <label for="hInput">Рост</label>
          <div class="stepper">
            <button type="button" id="minus" aria-label="Уменьшить рост на 1 см">−</button>
            <div class="num">
              <input id="hInput" type="number" inputmode="numeric" min="100" max="210" step="1" value="175" aria-describedby="hErr">
              <span class="unit">см</span>
            </div>
            <button type="button" id="plus" aria-label="Увеличить рост на 1 см">+</button>
          </div>
        </div>
        <div class="range">
          <input id="hRange" type="range" min="100" max="210" step="1" value="175" aria-label="Рост, сантиметры">
          <div class="range-scale"><span>100 см</span><span>210 см</span></div>
        </div>
        <p class="err" id="hErr"></p>
      </div>

      <div class="block">
        <p class="result-title">Длина базовой скакалки</p>
        <div class="big"><span id="lenOut">265</span><small>см</small></div>
        <p class="formula">рост <b id="fH">175</b> см <span class="plus">+ 90 см</span> = <b id="fL">265</b> см</p>
        <div class="unrolled">
          <svg viewBox="0 0 330 72" id="bar">
            <defs>
              <pattern id="beads" patternUnits="userSpaceOnUse" x="12" y="22" width="32" height="10">
                <rect x="0.6"  y="2" width="6.6" height="6" rx="2.2" fill="#F2BE22"/>
                <rect x="8.6"  y="2" width="6.6" height="6" rx="2.2" fill="#EF7D1A"/>
                <rect x="16.6" y="2" width="6.6" height="6" rx="2.2" fill="#D6302A"/>
                <rect x="24.6" y="2" width="6.6" height="6" rx="2.2" fill="#1D1F22"/>
              </pattern>
            </defs>
            <g id="barScale"></g>
            <line id="cord" x1="12" y1="27" x2="200" y2="27" stroke="#1D1F22" stroke-width="1.2"/>
            <rect id="beadRun" x="26" y="22" width="100" height="10" fill="url(#beads)"/>
            <rect id="hdlL" x="12" y="22.5" width="15" height="9" rx="3.5" fill="#2A2C30"/>
            <rect id="hdlR" x="200" y="22.5" width="15" height="9" rx="3.5" fill="#2A2C30"/>
            <path id="brH" fill="none" stroke="currentColor" stroke-width="1"/>
            <path id="brA" fill="none" stroke-width="1.4"/>
            <text id="brHt" class="svg-sans" font-size="12" text-anchor="middle" fill="currentColor">рост 175</text>
            <text id="brAt" class="svg-sans" font-size="12" font-weight="600" text-anchor="middle">+ 90</text>
          </svg>
          <p class="unrolled-cap">Так выглядит шнур, если разложить его на полу.</p>
        </div>
      </div>
    </div>
  </div>
  <p class="sr" aria-live="polite" id="live"></p>
</div>

<script>
(function(){
  var MIN=100, MAX=210, ADD=90, START=175;
  var FLOOR=246, CX=106;
  // source image geometry (px): head top 5, floor 1106, centre 225, size 450x1120
  var IMG_W=450, IMG_H=1120, HEAD=5, SOLE=1106, MID=225;
  var STRAND_X=346, STRAND_Y=800;

  var $=function(id){return document.getElementById(id)};
  var fig=$('fig'), headLine=$('headLine'), hLabel=$('hLabel'), hText=$('hText'),
      rulerFill=$('rulerFill'), dot=$('ropeDot'), lead=$('ropeLead'), cap=$('ropeCap'), rtext=$('ropeText'),
      shadow=$('shadow');
  var input=$('hInput'), range=$('hRange'), err=$('hErr'), live=$('live');
  var lenOut=$('lenOut'), fH=$('fH'), fL=$('fL');
  var cord=$('cord'), beadRun=$('beadRun'), hdlR=$('hdlR'), brH=$('brH'), brA=$('brA'), brHt=$('brHt'), brAt=$('brAt');

  var reduce=false;
  try{ reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

  // ruler
  (function(){
    var g=$('ruler'), s='';
    s+='<line x1="30" y1="'+(FLOOR)+'" x2="30" y2="'+(FLOOR-230)+'" stroke="#2B2E33" stroke-width=".8"/>';
    for(var v=0; v<=230; v+=10){
      var y=FLOOR-v, big=(v%50===0);
      s+='<line x1="'+(big?23:26)+'" y1="'+y+'" x2="30" y2="'+y+'" stroke="#2B2E33" stroke-width="'+(big?.8:.5)+'"/>';
      if(big && v>0) s+='<text x="20" y="'+(y+2.8)+'" text-anchor="end" font-size="8" fill="#7A8088" class="svg-sans">'+v+'</text>';
    }
    g.innerHTML=s;
  })();

  // unrolled rope scale
  var X0=12;
  (function(){
    var g=$('barScale'), s='';
    s+='<line x1="'+X0+'" y1="10" x2="'+(X0+300)+'" y2="10" stroke="currentColor" stroke-width=".6" opacity=".45"/>';
    for(var v=0; v<=300; v+=50){
      var x=X0+v, big=(v%100===0);
      s+='<line x1="'+x+'" y1="'+(big?6:8)+'" x2="'+x+'" y2="10" stroke="currentColor" stroke-width=".8" opacity=".55"/>';
      if(big) s+='<text x="'+x+'" y="3.5" text-anchor="'+(v===0?'start':(v===300?'end':'middle'))+'" font-size="9" fill="currentColor" opacity=".6" class="svg-sans">'+v+'</text>';
    }
    g.innerHTML=s;
  })();
  
  function accent(){ return '#C8261F'; }

  function render(h){
    var L=h+ADD, s=h/(SOLE-HEAD);
    // figure
    fig.setAttribute('width',(IMG_W*s).toFixed(2));
    fig.setAttribute('height',(IMG_H*s).toFixed(2));
    fig.setAttribute('x',(CX-MID*s).toFixed(2));
    fig.setAttribute('y',(FLOOR-SOLE*s).toFixed(2));
    shadow.setAttribute('rx',(h*0.24).toFixed(2));
    // height marker
    var hy=FLOOR-h;
    headLine.setAttribute('y1',hy); headLine.setAttribute('y2',hy);
    headLine.setAttribute('x2',(CX-72*s).toFixed(2));
    hLabel.setAttribute('transform','translate('+CX+','+(hy-12)+')');
    rulerFill.setAttribute('y',hy); rulerFill.setAttribute('height',h);
    var hr=Math.round(h), lr=Math.round(L);
    hText.textContent=hr+' см';
    // rope callout
    var px=CX+(STRAND_X-MID)*s, py=FLOOR-(SOLE-STRAND_Y)*s;
    dot.setAttribute('cx',px.toFixed(2)); dot.setAttribute('cy',py.toFixed(2));
    var lx=162, ly=Math.min(py, FLOOR-26);
    lead.setAttribute('points',(px+2.1).toFixed(2)+','+py.toFixed(2)+' '+(lx-8)+','+ly.toFixed(2)+' '+(lx-2)+','+ly.toFixed(2));
    cap.setAttribute('x',lx); cap.setAttribute('y',(ly-6).toFixed(2));
    rtext.setAttribute('x',lx); rtext.setAttribute('y',(ly+5).toFixed(2));
    rtext.textContent=lr+' см';
    // numbers
    lenOut.textContent=lr; fH.textContent=hr; fL.textContent=lr;
    // unrolled rope
    var xe=X0+L, xh=X0+h;
    cord.setAttribute('x2',xe.toFixed(2));
    beadRun.setAttribute('width',Math.max(0,L-30).toFixed(2));
    hdlR.setAttribute('x',(xe-15).toFixed(2));
    brH.setAttribute('d','M'+X0+',39 v4 H'+xh.toFixed(2)+' v-4');
    var a=accent();
    brA.setAttribute('stroke',a); brAt.setAttribute('fill',a);
    brA.setAttribute('d','M'+(xh+1.5).toFixed(2)+',43 H'+xe.toFixed(2)+' v-4');
    brHt.setAttribute('x',(X0+h/2).toFixed(2)); brHt.setAttribute('y','58');
    brHt.textContent='рост '+hr;
    brAt.setAttribute('x',(xh+ADD/2).toFixed(2)); brAt.setAttribute('y','58');
  }

  var cur=MIN, target=START, raf=null, liveT=null;
  function step(){
    var d=target-cur;
    if(Math.abs(d)<0.04){ cur=target; render(cur); raf=null; return; }
    cur+=d*0.14; render(cur); raf=requestAnimationFrame(step);
  }
  function go(){
    if(reduce){ cur=target; render(cur); return; }
    if(!raf) raf=requestAnimationFrame(step);
  }
  function setPct(v){ range.style.setProperty('--p',((v-MIN)/(MAX-MIN)*100)+'%'); }
  function announce(){
    clearTimeout(liveT);
    liveT=setTimeout(function(){ live.textContent='Рост '+target+' см, длина скакалки '+(target+ADD)+' см'; },500);
  }
  function setTarget(v, from){
    v=Math.round(v);
    v=Math.max(MIN,Math.min(MAX,v));
    target=v;
    if(from!=='input') input.value=v;
    if(from!=='range') range.value=v;
    setPct(v); go(); announce();
  }

  range.addEventListener('input',function(){ err.textContent=''; setTarget(+range.value,'range'); });
  input.addEventListener('input',function(){
    var raw=input.value.trim();
    if(raw===''){ err.textContent=''; return; }
    var v=Number(raw);
    if(!isFinite(v)){ return; }
    if(v<MIN || v>MAX){ err.textContent='Калькулятор работает для роста от '+MIN+' до '+MAX+' см.'; return; }
    err.textContent=''; setTarget(v,'input');
  });
  input.addEventListener('blur',function(){
    var v=Number(input.value);
    if(input.value.trim()==='' || !isFinite(v)){ input.value=target; err.textContent=''; return; }
    if(v<MIN || v>MAX){ setTarget(v); err.textContent='Калькулятор работает для роста от '+MIN+' до '+MAX+' см. Значение подставлено автоматически.'; }
    else input.value=Math.round(v);
  });
  input.addEventListener('keydown',function(e){ if(e.key==='Enter'){ input.blur(); } });
  function nudge(d){ err.textContent=''; setTarget(target+d); }
  $('minus').addEventListener('click',function(){ nudge(-1); });
  $('plus').addEventListener('click',function(){ nudge(1); });

  // first paint: grow from the minimum height to the starting value
  render(reduce?START:MIN);
  setPct(START);
  setTimeout(function(){ setTarget(START); }, reduce?0:250);

  try{
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){
      render(cur);
    });
  }catch(e){}
})();
</script>
<script src="vk-bridge.min.js"></script>

  // VK Mini Apps: сообщаем ВКонтакте, что приложение загрузилось
  try{ if(window.vkBridge){ vkBridge.send('VKWebAppInit').catch(function(){}); } }catch(e){}
</script>
</body>
</html>
